# Cấu hình mặc định của mọi ứng dụng Spark chạy từ image này; ghi đè được bằng --conf khi spark-submit.

spark.master                          spark://spark-master:7077
# driver chạy trong container (client mode) và lắng nghe mọi địa chỉ để executor kết nối ngược về được;
# spark.driver.host để mặc định vì hostname của container phân giải ra đúng IP của nó
spark.driver.bindAddress              0.0.0.0
spark.driver.memory                   1g
spark.executor.memory                 2g

spark.hadoop.fs.defaultFS             hdfs://namenode:8020
# cụm chỉ có 1 DataNode; không đặt thì file ghi ra xin 3 bản sao và bị báo thiếu bản sao
spark.hadoop.dfs.replication          1

spark.sql.adaptive.enabled            true
# 200 partition sau shuffle (mặc định) là quá nhiều cho dữ liệu khoảng 700 MB
spark.sql.shuffle.partitions          24
# chuyển dữ liệu giữa JVM và pandas theo cột bằng Arrow
spark.sql.execution.arrow.pyspark.enabled  true
spark.sql.session.timeZone            UTC
spark.serializer                      org.apache.spark.serializer.KryoSerializer
