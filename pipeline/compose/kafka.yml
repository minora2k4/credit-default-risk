# Kafka 1 node ở chế độ KRaft (vừa broker vừa controller).
# Image apache/kafka đổi các biến KAFKA_* thành server.properties (KAFKA_NODE_ID thành node.id).

services:
  kafka:
    image: ${KAFKA_IMAGE}
    hostname: kafka
    environment:
      # lần chạy đầu image tự format thư mục log bằng ID này
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}

      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      # địa chỉ broker lắng nghe
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      # địa chỉ broker báo cho client để kết nối lại: container dùng kafka:9092, client trên máy dùng localhost:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      # cụm 1 node nên topic nội bộ chỉ có 1 bản sao
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1

      # gõ sai tên topic thì báo lỗi, không tự tạo topic mới
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # consumer group đầu tiên không phải chờ 3 giây trước khi nhận partition
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # heap nhỏ hơn mem_limit để chừa chỗ cho bộ nhớ ngoài heap
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    ports:
      - "${BIND_ADDR}:${KAFKA_EXTERNAL_PORT}:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # tạo các topic của pipeline rồi thoát: make topics
  kafka-init:
    image: ${KAFKA_IMAGE}
    command: ["bash", "/scripts/create-topics.sh"]
    volumes:
      - ../docker/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  # giao diện web xem topic và message (http://localhost:8089), chỉ chạy với profile ui
  kafka-ui:
    image: ${KAFKA_UI_IMAGE}
    profiles: ["ui"]
    environment:
      KAFKA_CLUSTERS_0_NAME: credit
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
      JAVA_OPTS: -Xms128m -Xmx384m
    ports:
      - "${BIND_ADDR}:${KAFKA_UI_PORT}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 512m
    restart: unless-stopped

volumes:
  kafka_data:
